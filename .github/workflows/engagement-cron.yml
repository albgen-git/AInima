name: Engagement Daily Cron

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call engagement endpoint
        run: |
          curl -X POST https://ainima.onrender.com/internal/cron/engagement-daily \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -f
