services:
  - type: web
    name: ainima-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Senza pin, Render ha usato Python 3.14 (bleeding-edge, uscito da
      # poco) — sviluppato/testato tutto su 3.10, alcune dipendenze
      # (es. psycopg2-binary) rischiano di non avere ancora wheel
      # precompilate per 3.14. 3.12 è ampiamente supportata e stabile.
      - key: PYTHON_VERSION
        value: 3.12.7
      # Postgres (nessun DATABASE_URL: il codice legge 5 variabili
      # discrete, v. backend/db.py) — valori reali da inserire a mano.
      - key: PGHOST
        sync: false
      - key: PGPORT
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGDATABASE
        sync: false
      # Pipeline LLM (Gemini) — backend/services/llm_pipeline.py, text_embedding.py
      - key: GEMINI_API_KEY
        sync: false
      # Firma dei token di sessione JWT — backend/security.py
      - key: JWT_SECRET_KEY
        sync: false
      # Provider email OTP (RF-02) — backend/services/email_provider.py
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      # Dominio ainima.it verificato su Resend (record DKIM/SPF/DMARC
      # confermati live il 2026-09-02) — sostituisce il dominio sandbox
      # onboarding@resend.dev, che consegnava solo all'email del titolare
      # dell'account Resend e bloccava ogni test verso altri indirizzi
      # (es. danaestefania.al@gmail.com).
      - key: RESEND_FROM_EMAIL
        value: onboarding@ainima.it
      # Moderazione contenuti fotografici — nessun provider ancora scelto
      # nel progetto (v. CLAUDE.md), 'none' è il default sicuro esistente.
      - key: CONTENT_MODERATION_PROVIDER
        value: none
      # Login HTTP Basic Auth del pannello admin (routers/admin_viewer.py).
      # SPECIFICHE DI QUESTO AMBIENTE (collaudo) — un futuro servizio
      # Render separato per la produzione avrà una propria coppia
      # ADMIN_USERNAME/ADMIN_PASSWORD indipendente, mai le stesse di qui.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # RF-32d: protegge POST /internal/cron/engagement-daily
      # (routers/internal_cron.py) — confrontato con l'header
      # X-Cron-Secret. Scelto DELIBERATAMENTE al posto di un Render Cron
      # Job dedicato: quest'ultimo fattura al minuto anche per esecuzioni
      # brevi (minimo $1/mese sul piano Starter, non disponibile sul
      # piano Free usato qui) — un costo evitabile per un endpoint che il
      # servizio web già gratuito può esporre. Lo scheduling reale vive
      # invece in .github/workflows/engagement-cron.yml (GitHub Actions,
      # runner gratuiti), che chiama questo endpoint una volta al giorno
      # passando lo stesso valore come GitHub Secret del repository —
      # mai in chiaro nel workflow YAML.
      - key: CRON_SECRET
        sync: false
